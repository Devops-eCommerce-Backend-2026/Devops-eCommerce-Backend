version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    restart: on-failure
    environment:
      - MODE=dev
      - MONGO_URL=mongodb://mongo:27017/EcommerceDB
      - BASE_URL=http://localhost:3000/
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ecommerce-network

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  mongo_data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge
